<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi San Valentín?</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para íconos de corazón -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts para fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #a8e6cf, #dcedc8, #a8e6cf, #81c784); /* Degradado verde extendido */
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite; /* Animación de fondo más lenta */
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Corazones flotantes en el fondo */
        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .heart-float {
            position: absolute;
            color: rgba(76, 175, 80, 0.3);
            font-size: 2rem;
            animation: floatUp 15s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 70px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            border: 4px solid #4caf50;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.15) 0%, transparent 70%);
            animation: rotate 25s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .heart {
            color: #4caf50;
            font-size: 4.5rem;
            margin-bottom: 35px;
            animation: pulse 2.5s infinite;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .buttons-container {
            position: relative;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #btnSi, #btnNo {
            transition: all 0.6s ease;
            border-radius: 35px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        #btnSi::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        #btnSi:hover::before {
            left: 100%;
        }
        #btnSi {
            background: linear-gradient(45deg, #4caf50, #66bb6a);
            border: none;
            color: white;
        }
        #btnSi:hover {
            background: linear-gradient(45deg, #45a049, #4caf50);
            transform: scale(1.15) translateY(-8px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.5);
        }
        #btnNo {
            background: linear-gradient(45deg, #f44336, #e57373);
            border: none;
            color: white;
        }
        #btnNo:hover {
            background: linear-gradient(45deg, #d32f2f, #f44336);
            transform: scale(1.1);
        }
        .images {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .images img {
            max-width: 300px;
            height: auto;
            border-radius: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .images img:hover {
            transform: scale(1.08) rotate(3deg);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #2e7d32;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 3.2rem;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.15);
        }
        p {
            color: #388e3c;
            font-weight: 300;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .copyright {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #4caf50;
            font-weight: 400;
        }
        /* Estilos para la página de felicitación */
        .felicitacion {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 70px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            border: 4px solid #4caf50;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .felicitacion::after {
            content: '❤️';
            position: absolute;
            top: 10%;
            left: 10%;
            font-size: 2.5rem;
            animation: float 7s ease-in-out infinite;
        }
        .felicitacion::before {
            content: '🌸';
            position: absolute;
            top: 20%;
            right: 15%;
            font-size: 2.5rem;
            animation: float 9s ease-in-out infinite reverse;
        }
        .felicitacion .extra-hearts {
            position: absolute;
            top: 30%;
            left: 20%;
            font-size: 1.5rem;
            animation: float 5s ease-in-out infinite;
        }
        .felicitacion .extra-hearts::after {
            content: '💚';
            position: absolute;
            top: 50px;
            left: 50px;
            animation: float 6s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-25px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Corazones flotantes -->
    <div class="floating-hearts">
        <div class="heart-float" style="left: 10%; animation-delay: 0s;">❤️</div>
        <div class="heart-float" style="left: 20%; animation-delay: 2s;">💚</div>
        <div class="heart-float" style="left: 30%; animation-delay: 4s;">❤️</div>
        <div class="heart-float" style="left: 40%; animation-delay: 6s;">💚</div>
        <div class="heart-float" style="left: 50%; animation-delay: 8s;">❤️</div>
        <div class="heart-float" style="left: 60%; animation-delay: 10s;">💚</div>
        <div class="heart-float" style="left: 70%; animation-delay: 12s;">❤️</div>
        <div class="heart-float" style="left: 80%; animation-delay: 14s;">💚</div>
        <div class="heart-float" style="left: 90%; animation-delay: 16s;">❤️</div>
    </div>

    <div class="container text-center mt-5">
        <i class="fas fa-heart heart"></i>
        <h1>¿Quieres ser mi San Valentín?</h1>
        
        <!-- Imagen 1 encima del texto -->
        <div class="images mb-4">
            <img src="https://www.larepublica.ec/wp-content/uploads/2021/02/perros-sanvalentin-678x381.jpg" alt="Imagen romántica 1">
        </div>
        
        <p class="lead mb-4">Mi amor, eres lo mejor que me ha pasado. 
            Te amo demasiado, mucho, mucho y te queria preguntar si...
            ¿Quieres pasar este día especial conmigo? Te amo con todo mi corazón.</p>
        
        <!-- Botones arriba de la imagen 2 -->
        <div class="buttons-container mb-4">
            <button id="btnSi" class="btn btn-lg me-4" onclick="respuestaSi()">
                <i class="fas fa-check"></i> ¡Sí!
            </button>
            <button id="btnNo" class="btn btn-lg" onclick="respuestaNo()">
                <i class="fas fa-times"></i> No
            </button>
        </div>
        
        <!-- Imagen 2 abajo de los botones -->
        <div class="images">
            <img src="https://stickerly.pstatic.net/sticker_pack/GKxNn91GyJYvRhMszE6eOQ/E68GYA/21/740190855.png" alt="Imagen romántica 2">
        </div>
        
        <!-- Copyright -->
        <div class="copyright">
            © Andrés Hernandez
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let siScale = 1; // Escala inicial para el botón Sí

        function respuestaSi() {
            // Cambiar toda la página para mostrar el mensaje de felicitación con animaciones
            document.body.innerHTML = `
                <div class="felicitacion text-center mt-5">
                    <i class="fas fa-heart" style="color: #4caf50; font-size: 4.5rem; margin-bottom: 35px; animation: pulse 2.5s infinite; text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);"></i>
                    <h1 style="color: #2e7d32; font-family: 'Dancing Script', cursive; font-weight: 700; font-size: 3.2rem; text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.15);">¡Sí! Te amo mucho. Feliz San Valentín, mi amor. ❤️</h1>
                    <p class="lead" style="color: #388e3c; font-weight: 300; font-size: 1.2rem;">Eres lo mejor que me ha pasado. Gracias por decir que sí. ¡Te amo con todo mi corazón!</p>
                    <img src="https://static.wikia.nocookie.net/pucca/images/5/58/Index-3--1-.jpg/revision/latest/scale-to-width-down/340?cb=20120220174119&path-prefix=es" alt="Imagen de felicitación" style="max-width: 380px; height: auto; border-radius: 25px; margin-top: 35px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); transition: transform 0.4s ease;">
                    <div class="extra-hearts">💚</div>
                </div>
            `;
            // Agregar animación de entrada
            setTimeout(() => {
                document.querySelector('.felicitacion').style.animation = 'fadeIn 1s ease-in';
            }, 100);
        }

        function respuestaNo() {
            // Mover el botón No a una posición aleatoria
            const btnNo = document.getElementById('btnNo');
            btnNo.style.position = 'absolute';
            const container = document.querySelector('.buttons-container');
            const containerRect = container.getBoundingClientRect();
            
            const randomTop = Math.random() * (containerRect.height - btnNo.offsetHeight);
            const randomLeft = Math.random() * (containerRect.width - btnNo.offsetWidth);
            
            btnNo.style.top = randomTop + 'px';
            btnNo.style.left = randomLeft + 'px';
            
            // Hacer el botón Sí 2 veces más grande cada vez
            const btnSi = document.getElementById('btnSi');
            siScale *= 2;
            btnSi.style.transform = `scale(${siScale})`;
            
            // Si el botón Sí abarca toda la pantalla, ocultar el botón No
            if (btnSi.offsetHeight * siScale > window.innerHeight || btnSi.offsetWidth * siScale > window.innerWidth) {
                btnNo.style.display = 'none';
            }
        }
    </script>
</body>
</html>
